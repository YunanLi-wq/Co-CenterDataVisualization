<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Higher Manager Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='tableStyle.css') }}">
    
<link rel="stylesheet" href="{{ url_for('static', filename='higher_manager_login.page.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🔐 Higher Manager Access</h1>
            <p>Administrative access to review and approve items</p>
        </div>
        
        <div class="login-form">
            <div class="security-notice">
                <h4>🔒 Security Notice</h4>
                <p>This is a restricted access area. Only authorized higher managers can access the approval system.</p>
            </div>
            
            <div id="error-message" class="error-message" style="display: none;"></div>
            
            <form id="higherManagerLoginForm">
                <div class="form-group">
                    <label for="username">Higher Manager Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit" class="login-button" id="loginButton">
                    🔐 Access Approval System
                </button>
            </form>
            
            <div class="back-link">
                <a href="{{ url_for('d3viz') }}">← Back to Food Co-Centre Sustainability Compass</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('higherManagerLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginButton = document.getElementById('loginButton');
            const errorMessage = document.getElementById('error-message');
            
            // Disable button and show loading
            loginButton.disabled = true;
            loginButton.textContent = '🔐 Authenticating...';
            errorMessage.style.display = 'none';
            
            try {
                const response = await fetch('/api/auth/higher-manager-login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Store higher manager session info and redirect to dashboard
                    sessionStorage.setItem('higher_manager_authenticated', 'true');
                    sessionStorage.setItem('higher_manager_username', username);
                    window.location.href = '/higher-manager-dashboard';
                } else {
                    // Show error message
                    errorMessage.textContent = data.error || 'Authentication failed';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = 'Network error. Please try again.';
                errorMessage.style.display = 'block';
            } finally {
                // Re-enable button
                loginButton.disabled = false;
                loginButton.textContent = '🔐 Access Approval System';
            }
        });
    </script>
</body>
</html>

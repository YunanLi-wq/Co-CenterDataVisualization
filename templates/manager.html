<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dataset - Database Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='tableStyle.css') }}">
    
<link rel="stylesheet" href="{{ url_for('static', filename='manager.page.css') }}">
</head>
<body>
    <a href="/higher-manager-dashboard" class="add-item-button">← Back to Dashboard</a>
    
    <div class="manager-container">
        <div class="manager-header">
            <h1>🗄️ Manager Dataset</h1>
            <p>Direct Database Management Interface</p>
        </div>
        
        <div class="manager-content">
            <div id="success-message" class="success-message" style="display: none;"></div>
            <div id="error-message" class="error-message" style="display: none;"></div>
            
            <div class="action-buttons">
                <button onclick="showAddModal()" class="action-button add-button">➕ Add New Record</button>
                <button onclick="refreshData()" class="action-button">🔄 Refresh Data</button>
                <button onclick="exportAllData()" class="action-button export-button">📊 Export All Data</button>
            </div>
            
            <div class="search-container">
                <h3>🔍 Search Database</h3>
                <div class="search-controls">
                    <input type="text" id="search-input" placeholder="Search across all columns..." class="search-input">
                    <button onclick="searchData()" class="search-button">🔍 Search</button>
                    <button onclick="clearSearch()" class="search-button clear-button">Clear</button>
                </div>
            </div>
            
            <div id="data-container">
                <div class="loading">
                    <h3>Loading database records...</h3>
                    <p>Please wait while we fetch the data.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="recordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Record</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            
            <form id="recordForm">
                <div class="form-group">
                    <label for="quadrant">Quadrant:</label>
                    <input type="text" id="quadrant" name="Quadrant" placeholder="Enter quadrant (optional)">
                </div>
                
                <div class="form-group">
                    <label for="segment">Segment:</label>
                    <input type="text" id="segment" name="Segment" placeholder="Enter segment (optional)">
                </div>
                
                <div class="form-group">
                    <label for="factor">Factor:</label>
                    <input type="text" id="factor" name="Factor" placeholder="Enter factor (optional)">
                </div>
                
                <div class="form-group">
                    <label for="location">Location:</label>
                    <input type="text" id="location" name="Location" placeholder="Enter location (optional)">
                </div>
                
                <div class="form-group">
                    <label for="indicator">Indicator:</label>
                    <textarea id="indicator" name="Indicator" placeholder="Enter indicator (optional)"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="Title" placeholder="Enter title (optional)">
                </div>
                
                <div class="form-group">
                    <label for="url">URL:</label>
                    <input type="url" id="url" name="Url" placeholder="Enter URL (optional)">
                </div>
                
                <div class="form-group">
                    <label for="datatype">Datatype:</label>
                    <select id="datatype" name="Datatype">
                        <option value="">Select Datatype (optional)</option>
                        <option value="PDF">PDF</option>
                        <option value="Excel">Excel</option>
                        <option value="CSV">CSV</option>
                        <option value="JSON">JSON</option>
                        <option value="Website">Website</option>
                        <option value="Database">Database</option>
                        <option value="Report">Report</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                
                <div class="modal-actions">
                    <button type="button" onclick="closeModal()" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary" id="submitButton">Add Record</button>
                </div>
            </form>
        </div>
    </div>

    <div class="navigation-buttons" style="margin-top: 30px;">
        <a href="/higher-manager-dashboard" class="nav-button back-button">← Back to Dashboard</a>
        <a href="/update" class="nav-button">📋 Review Submissions</a>
        <a href="{{ url_for('d3viz') }}" class="nav-button">🧭 Food Co-Centre Sustainability Compass</a>
    </div>

    <script>
        let currentData = [];
        let currentRecordId = null;
        
        // Check higher manager authentication
        if (!sessionStorage.getItem('higher_manager_authenticated')) {
            window.location.href = '/higher-manager-login';
        }
        
        // Load data on page load
        window.onload = function() {
            loadAllData();
        };
        
        async function loadAllData() {
            try {
                const response = await fetch('/api/dataset/all');
                const data = await response.json();
                
                if (data.success) {
                    currentData = data.records;
                    displayData(data.records);
                } else {
                    showError('Failed to load data: ' + data.error);
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Failed to connect to database');
            }
        }
        
        function displayData(records) {
            const container = document.getElementById('data-container');
            
            if (records.length === 0) {
                container.innerHTML = `
                    <div class="no-data">
                        <h3>No Data Found</h3>
                        <p>No records found in the database.</p>
                    </div>
                `;
                return;
            }
            
            // Get all unique keys from all records
            const allKeys = new Set();
            records.forEach(record => {
                Object.keys(record).forEach(key => allKeys.add(key));
            });
            
            // Priority order for columns
            const priorityFields = [
                'Quadrant', 'Segment', 'Factor', 'Location', 
                'Indicator', 'Title', 'Url', 'Datatype'
            ];
            
            // Fields to move to the end
            const endFields = ['_id', '_created', '_updated', 'id'];
            
            // Reorder headers according to priority
            const orderedHeaders = [];
            const remainingKeys = Array.from(allKeys);
            
            for (const field of priorityFields) {
                if (remainingKeys.includes(field)) {
                    orderedHeaders.push(field);
                    remainingKeys.splice(remainingKeys.indexOf(field), 1);
                }
            }
            
            // Add remaining headers in alphabetical order
            orderedHeaders.push(...remainingKeys.sort());
            
            // Move end fields to the back
            for (const field of endFields) {
                if (orderedHeaders.includes(field)) {
                    orderedHeaders.splice(orderedHeaders.indexOf(field), 1);
                    orderedHeaders.push(field);
                }
            }
            
            const headers = orderedHeaders;
            
            // Create table HTML
            let tableHTML = `
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                ${headers.map(header => `<th>${header}</th>`).join('')}
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            records.forEach(record => {
                tableHTML += '<tr>';
                headers.forEach(header => {
                    const value = record[header];
                    let displayValue = '';
                    
                    if (value === null || value === undefined) {
                        displayValue = '<em style="color: #999;">Empty</em>';
                    } else if (typeof value === 'object') {
                        displayValue = JSON.stringify(value);
                    } else {
                        displayValue = String(value);
                    }
                    
                    // Make URL column clickable
                    if (header === 'Url' && value && value !== null && value.startsWith('http')) {
                        tableHTML += `<td title="${displayValue}"><a href="${value}" target="_blank" style="color: #007bff; text-decoration: underline;">${displayValue}</a></td>`;
                    } else {
                        tableHTML += `<td title="${displayValue}">${displayValue}</td>`;
                    }
                });
                
                // Add action buttons
                tableHTML += `
                    <td class="action-cell">
                        <button onclick="editRecord('${record._id}')" class="action-button edit-button">✏️ Edit</button>
                        <button onclick="deleteRecord('${record._id}')" class="action-button delete-button">🗑️ Delete</button>
                    </td>
                `;
                
                tableHTML += '</tr>';
            });
            
            tableHTML += `
                        </tbody>
                    </table>
                </div>
            `;
            
            container.innerHTML = tableHTML;
        }
        
        function showAddModal() {
            currentRecordId = null;
            document.getElementById('modalTitle').textContent = 'Add New Record';
            document.getElementById('submitButton').textContent = 'Add Record';
            document.getElementById('recordForm').reset();
            document.getElementById('recordModal').style.display = 'block';
        }
        
        function editRecord(recordId) {
            const record = currentData.find(r => r._id === recordId);
            if (!record) return;
            
            currentRecordId = recordId;
            document.getElementById('modalTitle').textContent = 'Edit Record';
            document.getElementById('submitButton').textContent = 'Update Record';
            
            // Fill form with record data
            document.getElementById('quadrant').value = record.Quadrant || '';
            document.getElementById('segment').value = record.Segment || '';
            document.getElementById('factor').value = record.Factor || '';
            document.getElementById('location').value = record.Location || '';
            document.getElementById('indicator').value = record.Indicator || '';
            document.getElementById('title').value = record.Title || '';
            document.getElementById('url').value = record.Url || '';
            document.getElementById('datatype').value = record.Datatype || '';
            
            document.getElementById('recordModal').style.display = 'block';
        }
        
        async function deleteRecord(recordId) {
            if (!confirm('Are you sure you want to delete this record? This action cannot be undone.')) {
                return;
            }
            
            try {
                const response = await fetch('/api/dataset/delete', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ _id: recordId })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showSuccess('Record deleted successfully!');
                    // Remove the record from current data
                    currentData = currentData.filter(record => record._id !== recordId);
                    // Refresh the display
                    displayData(currentData);
                } else {
                    showError('Failed to delete record: ' + data.error);
                }
            } catch (error) {
                console.error('Delete error:', error);
                showError('Network error. Please try again.');
            }
        }
        
        function closeModal() {
            document.getElementById('recordModal').style.display = 'none';
        }
        
        function refreshData() {
            loadAllData();
        }
        
        function searchData() {
            const searchTerm = document.getElementById('search-input').value.trim();
            if (!searchTerm) {
                displayData(currentData);
                return;
            }
            
            const filteredData = currentData.filter(record => {
                return Object.values(record).some(value => 
                    String(value).toLowerCase().includes(searchTerm.toLowerCase())
                );
            });
            
            displayData(filteredData);
        }
        
        function clearSearch() {
            document.getElementById('search-input').value = '';
            displayData(currentData);
        }
        
        async function exportAllData() {
            try {
                const response = await fetch('/api/dataset/export-all');
                const blob = await response.blob();
                
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'all_database_records.xlsx';
                document.body.appendChild(a);
                a.click();
                
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                showSuccess('All data exported successfully!');
            } catch (error) {
                console.error('Export error:', error);
                showError('Failed to export data');
            }
        }
        
        // Handle form submission
        document.getElementById('recordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const recordData = Object.fromEntries(formData.entries());
            
            // Clean up empty values - convert empty strings to null or remove them
            Object.keys(recordData).forEach(key => {
                if (recordData[key] === '' || recordData[key] === null || recordData[key] === undefined) {
                    recordData[key] = null; // Keep as null instead of removing
                }
            });
            
            try {
                const url = currentRecordId ? '/api/dataset/update' : '/api/dataset/add-direct';
                const method = currentRecordId ? 'PUT' : 'POST';
                
                if (currentRecordId) {
                    recordData._id = currentRecordId;
                }
                
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(recordData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showSuccess(currentRecordId ? 'Record updated successfully!' : 'Record added successfully!');
                    closeModal();
                    loadAllData();
                } else {
                    showError('Failed to save record: ' + data.error);
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Network error. Please try again.');
            }
        });
        
        function showSuccess(message) {
            const successDiv = document.getElementById('success-message');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 5000);
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('recordModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
